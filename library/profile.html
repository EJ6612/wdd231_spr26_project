<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <title>Student Store | Profile</title>


    <meta
        name="description"
        content="Manage your Student Store profile, listings, sales and saved items."
    >


    <!-- Styles -->

    <link rel="stylesheet" href="../styles/homepage.css">
    <link rel="stylesheet" href="../styles/header.css">
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="../styles/user.css">
	<link rel="stylesheet" href="../styles/filter.css">


    <!-- Fonts -->

    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
        rel="stylesheet"
    >


    <!-- Scripts -->

    <script
        type="module"
        src="../js/populate_user_feed.js"
        defer>
    </script>


    <script
        type="module"
        src="../js/filter-collapse.js"
        defer>
    </script>


    <script
        src="../js/mobile-menu.js"
        defer>
    </script>


</head>



<body class="profile-page">



<!-- =====================================
     HEADER
===================================== -->

<header>


    <div class="header-top">


        <h1 class="site-logo">

            <a href="../index.html">
                Student Store
            </a>

        </h1>



        <button
            class="mobile-menu-btn"
            id="mobile-menu-btn"
            type="button"
            aria-label="Toggle navigation"
            aria-controls="main-nav"
            aria-expanded="false">

            <span class="material-symbols-outlined">
                menu
            </span>

        </button>





        <form
            class="search-form"
            role="search">


            <input
                id="search-input"
                type="search"
                placeholder="Search textbooks, tech, furniture..."
                aria-label="Search listings"
            >



            <button
                type="submit"
                aria-label="Search">

                <span class="material-symbols-outlined">
                    search
                </span>

            </button>


        </form>





        <nav
            class="account-nav"
            aria-label="Account">


            <a
                href="./index.html"
                class="btn--account">


                <span class="material-symbols-outlined">
                    account_circle
                </span>


                Account


            </a>


        </nav>


    </div>





    <nav
        id="main-nav"
        class="main-nav"
        aria-label="Main navigation">


        <a href="../index.html">
            Home
        </a>


        <a href="../library/browse.html">
            Browse
        </a>


        <a href="../library/sell-new-item.html">
            Sell
        </a>


        <a
            href="../library/profile.html"
            class="active">

            Profile

        </a>


        <a href="../library/about.html">
            About
        </a>


    </nav>


</header>






<!-- =====================================
     PROFILE HEADER
===================================== -->


<section class="profile-section">


    <div class="profile-card">


        <div
            class="profile-avatar"
            aria-hidden="true">
        </div>




        <div class="profile-info">


            <h2 id="profileName">
                Student Name
            </h2>



            <p id="profileMajor">
                Computer Science • Senior
            </p>



            <p class="profile-meta">
                Member since 2025
            </p>





            <div class="profile-stats">


                <div>

                    <strong class="stat-number">
                        0
                    </strong>

                    <span class="stat-label">
                        Listings
                    </span>

                </div>



                <div>

                    <strong class="stat-number">
                        0
                    </strong>

                    <span class="stat-label">
                        Sold
                    </span>

                </div>



                <div>

                    <strong class="stat-number">
                        0
                    </strong>

                    <span class="stat-label">
                        Favorites
                    </span>

                </div>



            </div>



        </div>





        <div class="profile-actions">


            <a
                href="../sell-new-item/index.html"
                class="btn-primary">

                New Listing

            </a>


        </div>


    </div>


</section>






<!-- =====================================
     LISTINGS
===================================== -->


<main>


<section class="feed">


    <div class="section-header">

        <h2>
            My Listings
        </h2>

    </div>





    <aside
        class="filter-panel"
        aria-label="Filter listings">


        <button
            class="filter-panel__toggle"
            type="button"
            aria-expanded="false"
            aria-controls="filter-panel-content">


            <span class="filter-panel__heading">
                Filters
            </span>



            <span
                id="filter-panel-icon"
                aria-hidden="true">

                +

            </span>


        </button>





        <div
            id="filter-panel-content"
            class="filter-panel__content">



            <fieldset>


                <legend>
                    Category
                </legend>



                <label>
                    <input type="checkbox" name="category" value="textbooks">
                    Textbooks
                </label>



                <label>
                    <input type="checkbox" name="category" value="electronics">
                    Electronics
                </label>



                <label>
                    <input type="checkbox" name="category" value="furniture">
                    Furniture
                </label>



                <label>
                    <input type="checkbox" name="category" value="clothing">
                    Clothing
                </label>



                <label>
                    <input type="checkbox" name="category" value="other">
                    Other
                </label>



            </fieldset>





            <fieldset>


                <legend>
                    Price
                </legend>


                <div class="price-range">


                    <input
                        id="price-min"
                        type="number"
                        placeholder="Min $"
                    >


                    <input
                        id="price-max"
                        type="number"
                        placeholder="Max $"
                    >


                </div>


            </fieldset>




            <button
                class="btn--apply-filters"
                type="button">

                Apply Filters

            </button>



        </div>


    </aside>





    <section
        class="browse-results"
        aria-label="User listings">


        <ul
            id="item-grid"
            class="item-grid"
            role="list">

        </ul>


    </section>



</section>



</main>







<!-- =====================================
     FOOTER
===================================== -->


<footer>


    <p class="footer__brand">
        Student Store
    </p>



    <p class="footer__copyright">

        ©
        <span class="footer__year"></span>

        Student Store.
        All rights reserved.

    </p>




    <nav
        class="footer__links"
        aria-label="Footer navigation">


        <ul>


            <li>
                <a href="../about/index.html">
                    About
                </a>
            </li>


            <li>
                <a href="../privacy/index.html">
                    Privacy
                </a>
            </li>


        </ul>


    </nav>


</footer>



</body>

</html>
