    <main>
        <!-- Feed -->
            <!-- Filter -->
                <!-- Categories -->
                <!-- Price range (?) -->
            <!-- Items -->

             <!-- =============================================
             FEED SECTION
             Sidebar filter + item grid.
             Items are injected by feed.js at runtime;
             one static example card is included below
             as a template reference for the JS renderer.
             ============================================= -->
        <section class="feed" aria-labelledby="feed-title">
            <h2 id="feed-title" class="visually-hidden">Browse Listings</h2>

            <!-- -----------------------------------------
                 FILTER PANEL
                 JS should read these controls and re-query
                 / re-render the #item-grid on change.
                 TODO at some point, make collapsable
                 ----------------------------------------- -->
            <aside class="filter-panel" aria-label="Filter listings">
                <button
                    type="button"
                    class="filter-panel__toggle"
                    aria-expanded="false"
                    aria-controls="filter-panel-content"
                >
                    <span class="filter-panel__heading">Filter</span>
                    <span id="filter-panel-icon" class="filter-panel__heading" aria-hidden="true">−</span>
                </button>

                <!-- Categories
                     Add / remove <li> items to match your
                     category taxonomy in the database.      -->
                <div id="filter-panel-content" class="filter-panel__content">
                    <div class="filter-panel__inner">
                        <fieldset class="filter-panel__group">
                            <legend class="filter-panel_category">Category</legend>
                            <ul class="filter-panel__list" role="list">
                                <li>
                                    <label>
                                        <input type="checkbox" name="category" value="textbooks">
                                        Textbooks
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="checkbox" name="category" value="electronics">
                                        Electronics
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="checkbox" name="category" value="furniture">
                                        Furniture
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="checkbox" name="category" value="clothing">
                                        Clothing
                                    </label>
                                </li>
                                <li>
                                    <label>
                                        <input type="checkbox" name="category" value="other">
                                        Other
                                    </label>
                                </li>
                            </ul>
                        </fieldset>

                        <!-- Price Range
                            JS should debounce the 'input' event
                            and update the #price-display label.    -->
                        <fieldset class="filter-panel__group">
                            <legend>Price Range</legend>
                            <div class="price-range">
                                <label for="price-min" class="visually-hidden">Minimum price</label>
                                <input
                                    id="price-min"
                                    type="number"
                                    name="price_min"
                                    min="0"
                                    placeholder="Min $"
                                    aria-label="Minimum price"
                                >
                                <span aria-hidden="true">–</span>
                                <label for="price-max" class="visually-hidden">Maximum price</label>
                                <input
                                    id="price-max"
                                    type="number"
                                    name="price_max"
                                    min="0"
                                    placeholder="Max $"
                                    aria-label="Maximum price"
                                >
                            </div>
                        </fieldset>

                        <button type="button" class="btn--apply-filters">Apply Filters</button>
                    </div>
                </div>
            </aside>


            <!-- -----------------------------------------
                 ITEM GRID
                 JS (feed.js) empties this container and
                 injects rendered item cards on page load
                 and whenever filters change.

                 The card below is a single static EXAMPLE
                 showing the expected card structure. The
                 JS renderer should produce identical markup
                 for each item it injects.
                 ----------------------------------------- -->
            <ul id="item-grid" class="item-grid" role="list" aria-label="Listings">

            </ul>
            <!-- End #item-grid -->

        </section>
        <!-- End .feed -->
